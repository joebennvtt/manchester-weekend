<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)">
  <title>Manchester Weekend</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23B23A1F%22/><circle cx=%2250%22 cy=%2250%22 r=%2216%22 fill=%22%23fff%22/></svg>">
  <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/explore.css">
  <link rel="stylesheet" href="css/plan.css">
  <link rel="stylesheet" href="css/map.css">
</head>
<body>
  <div class="app">
    <div class="map-wrap">
      <div id="map" aria-label="Map of places"></div>
      <div id="preview" class="preview" role="region" aria-label="Selected place" hidden></div>
    </div>
    <main class="panel" id="panel">
      <header class="top">
        <button class="grabber" id="grabber" aria-label="Resize map and list" aria-expanded="true"></button>
        <div class="brand"><h1>Manchester</h1><span class="brand-dates">20–23 Nov</span></div>
        <nav class="tabs" role="tablist" aria-label="Sections">
          <button role="tab" id="tab-explore" class="tab active" data-tab="explore" aria-selected="true"><span data-icon="map"></span><span class="tab-label">Explore</span></button>
          <button role="tab" id="tab-plan" class="tab" data-tab="plan" aria-selected="false"><span data-icon="calendar"></span><span class="tab-label">Plan</span><span id="plan-count" class="badge"></span></button>
          <button role="tab" id="tab-book" class="tab" data-tab="book" aria-selected="false"><span data-icon="ticket"></span><span class="tab-label">Book ahead</span><span id="book-count" class="badge"></span></button>
        </nav>
        <div class="toolbar" id="toolbar">
          <div class="toolbar-row">
            <label class="search"><span data-icon="search"></span><input id="q" type="search" placeholder="Search places, tags, cuisine" aria-label="Search"></label>
            <button class="btn btn-secondary filters-btn" id="filters-btn" aria-haspopup="dialog"><span data-icon="sliders"></span><span>Filters</span><span id="filters-count" class="badge" hidden></span></button>
          </div>
          <div class="quick" id="quick" role="group" aria-label="Quick filters">
            <button class="chip" data-quick="open" aria-pressed="false"><span data-icon="clock" data-size="16"></span>Open now<span data-icon="check" data-size="16" data-cls="chip-check"></span></button>
            <button class="chip" data-quick="food" aria-pressed="false"><span data-icon="utensils" data-size="16"></span>Food<span data-icon="check" data-size="16" data-cls="chip-check"></span></button>
            <button class="chip" data-quick="drinks" aria-pressed="false"><span data-icon="martini" data-size="16"></span>Drinks<span data-icon="check" data-size="16" data-cls="chip-check"></span></button>
            <button class="chip" data-quick="sights" aria-pressed="false"><span data-icon="landmark" data-size="16"></span>Sights<span data-icon="check" data-size="16" data-cls="chip-check"></span></button>
            <button class="chip" data-quick="shops" aria-pressed="false"><span data-icon="shirt" data-size="16"></span>Shops<span data-icon="check" data-size="16" data-cls="chip-check"></span></button>
            <button class="chip" data-quick="indoors" aria-pressed="false"><span data-icon="umbrella" data-size="16"></span>Indoors<span data-icon="check" data-size="16" data-cls="chip-check"></span></button>
            <button class="chip" data-quick="shortlist" aria-pressed="false"><span data-icon="star" data-size="16"></span>Shortlist<span data-icon="check" data-size="16" data-cls="chip-check"></span></button>
          </div>
        </div>
      </header>
      <div id="net" class="net callout" role="status" hidden></div>
      <div id="toast" class="toast" role="status" hidden></div>
      <section id="share-banner" class="share-banner" aria-label="Shared plan" hidden></section>
      <section id="view-explore">
        <div class="nowbar">
          <button class="clock" id="clock" aria-label="Change day and time"></button>
          <span id="count" class="count" aria-live="polite"></span>
        </div>
        <div id="walk-from" class="walk-from"></div>
        <div id="list" class="list"></div>
      </section>
      <section id="view-plan" class="plan" hidden></section>
      <section id="view-book" hidden></section>
      <section id="details" class="details" hidden></section>
    </main>
  </div>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-handle" aria-hidden="true"></div>
    <header class="sheet-head">
      <h2 id="sheet-title">Filters</h2>
      <button class="btn btn-ghost btn-sm" id="clear">Clear all</button>
      <button class="btn btn-ghost btn-icon" id="sheet-close" aria-label="Close filters"><span data-icon="x"></span></button>
    </header>
    <div class="sheet-body filters" id="filters">
      <div class="group"><span class="group-label" id="h-type">Type</span><div class="chips" id="type-chips" role="group" aria-labelledby="h-type"></div></div>
      <div class="group" id="food-group" hidden><span class="group-label" id="h-food">Food type</span><div class="chips" id="food-chips" role="group" aria-labelledby="h-food"></div></div>
      <div class="group"><span class="group-label" id="h-meal">Meal</span><div class="chips" id="meal-chips" role="group" aria-labelledby="h-meal"></div></div>
      <div class="group" id="price-group" hidden><span class="group-label" id="h-price">Price</span><div class="chips" id="price-chips" role="group" aria-labelledby="h-price"></div></div>
      <div class="group" id="rating-group"><span class="group-label" id="h-rating">Google rating</span><div class="chips" id="rating-chips" role="group" aria-labelledby="h-rating"></div><span class="hint">cafés, restaurants, bars &amp; pubs</span></div>
      <div class="group" id="area-group" hidden><span class="group-label" id="h-area">Area</span><div class="chips" id="area-chips" role="group" aria-labelledby="h-area"></div></div>
      <div class="group"><span class="group-label" id="h-booking">Booking</span><div class="chips" id="booking-chips" role="group" aria-labelledby="h-booking"></div></div>
      <div class="group" id="open-at-group"><span class="group-label" aria-hidden="true">Open at</span>
        <div class="open-at" role="group" aria-label="Open at">
          <label class="switch"><input type="checkbox" id="open-on" role="switch"><span>Open at</span></label>
          <div class="open-at-pick">
            <select id="open-day" aria-label="Day">
              <option value="fri">Fri 20 Nov</option><option value="sat">Sat 21 Nov</option>
              <option value="sun">Sun 22 Nov</option><option value="mon">Mon 23 Nov</option>
            </select>
            <input type="time" id="open-time" value="12:00" aria-label="Time">
          </div>
          <label class="switch"><input type="checkbox" id="hide-closed" role="switch"><span>Hide closed</span></label>
        </div>
      </div>
      <div class="group"><span class="group-label" id="h-show">Show</span>
        <div class="row" role="group" aria-labelledby="h-show">
          <button class="chip" id="shortlist-only" aria-pressed="false"><span data-icon="star" data-size="16"></span>Shortlist only<span data-icon="check" data-size="16" data-cls="chip-check"></span></button>
          <button class="chip" id="indoor-only" aria-pressed="false"><span data-icon="umbrella" data-size="16"></span>Indoors only<span data-icon="check" data-size="16" data-cls="chip-check"></span></button>
          <button class="chip" id="day-trips" title="Fit all places including Chester and Altrincham"><span data-icon="map" data-size="16"></span>Day trips</button>
        </div>
        <label class="switch" id="sort-wrap"><input type="checkbox" id="sort-nearest" role="switch"><span>Sort: nearest</span></label>
      </div>
    </div>
    <footer class="sheet-foot"><button class="btn btn-primary btn-block" id="sheet-done">Show places</button></footer>
  </dialog>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
  <script src="data/places.js"></script>
  <script src="data/getting-home.js"></script>
  <script src="lib.js"></script>
  <script src="home.js"></script>
  <script src="plan.js"></script>
  <script src="tiles.js"></script>
  <script src="icons.js"></script>
  <script src="render.js"></script>
  <script src="render-plan.js"></script>
  <script src="basemap.js"></script>
  <script src="locate.js"></script>
  <script src="offline.js"></script>
  <script src="app.js"></script>
</body>
</html>
